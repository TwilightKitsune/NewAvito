<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../static/style/styleHeader.css" th:href="@{/style/styleHeader.css}" rel="stylesheet" />
    <link href="../static/style/styleLogin.css" th:href="@{/style/styleLogin.css}" rel="stylesheet" />
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="divMain">
    <h2>Зарегистрироваться</h2>
    <p th:text="${wrong}" class="wrong"/>
    <form class="form" action="Registration" method="post">
        <label class="label" for="Name">Ваше имя:</label>
        <input class="text" type="text" id="Name" name="name" placeholder="Введите имя" required>
        <label class="label" for="Surname">Ваша фамилия:</label>
        <input class="text" type="text" id="Surname" name="surname" placeholder="Введите фамилию" required>
        <label class="label" for="Patronymic">Ваше отчество:</label>
        <input class="text" type="text" id="Patronymic" name="patronymic" placeholder="Введите отчество">
        <label class="label" for="Login">Придумайте логин:</label>
        <input class="text" type="text" id="Login" name="login" placeholder="Введите логин" required>
        <label class="label" for="Password1">Придумайте пароль:</label>
        <input class="text" type="password" id="Password1" name="password1" placeholder="Введите пароль" required>
        <label class="label" for="Password2">Повторите пароль:</label>
        <input class="text" type="password" id="Password2" name="password2" placeholder="Повторите пароль" required>
        <label class="label" for="Phone">Ваш телефон:</label>
        <input class="text" type="text" id="Phone" name="phone" placeholder="81234567890" pattern = "([+][7]||[8])[0-9]{3}[0-9]{3}[0-9]{2}[0-9]{2}" onkeyup="this.value = this.value.replace(/[^/0-9]\W/g,'');" title="Вы ввели некорректный телефон" required>
        <label class="label" for="Email">Ваша почта:</label>
        <input class="text" type="text" id="Email" name="email" placeholder="Введите почту" pattern='^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$' title="Вы ввели некорректный email" required>
        <label class="label" for="Address">Ваш адрес:</label>
        <input class="text" type="text" id="Address" name="address" placeholder="Введите адрес" required>
        <br>
        <button class="button" type="submit" style="width: 158px; margin-left: 36px;">Зарегистрироваться</button>
    </form>
    <label class="label" for="LoginInput">У вас уже есть аккаунт?</label>
    <a id="LoginInput" th:href="Login" style="border: 0;
                            border-style: solid;
                            text-decoration: none;
                            color: white;
                            font-size: 17px;
                            padding: 5px 10px;
                            border-radius: 5px;
                            background-color: #133d60;">Войти</a>
</div>
</body>
</html>
