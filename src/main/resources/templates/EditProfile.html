<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование профиля</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../static/style/styleHeader.css" th:href="@{/style/styleHeader.css}" rel="stylesheet" />
    <link href="../static/style/styleLogin.css" th:href="@{/style/styleLogin.css}" rel="stylesheet" />
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="divMain">
    <h2>Редактирование профиля</h2>
    <p th:text="${wrong}" class="wrong"/>
    <form class="form" method="post">
        <label class="label" for="Name">Имя:</label>
        <input class="text" type="text" th:value="${user.getName()}" id="Name" name="name" placeholder="Введите имя"  required>
        <label class="label" for="Surname">Фамилия:</label>
        <input class="text" type="text" id="Surname" name="surname" placeholder="Введите фамилию" th:value="${user.getSurname()}" required>
        <label class="label" for="Patronymic">Отчество:</label>
        <input class="text" type="text" id="Patronymic" name="patronymic" placeholder="Введите отчество" th:value="${user.getPatronymic()}">
        <label class="label" for="Login">Логин:</label>
        <input class="text" type="text" id="Login" name="login" placeholder="Введите логин" th:value="${user.getLogin()}" required>
        <label class="label" for="Phone">Телефон:</label>
        <input class="text" type="text" id="Phone" name="phone" placeholder="81234567890" th:value="${user.getPhone()}" pattern = "([+][7]||[8])[0-9]{3}[0-9]{3}[0-9]{2}[0-9]{2}" onkeyup="this.value = this.value.replace(/[^/0-9]\W/g,'');" title="Вы ввели некорректный телефон" required>
        <label class="label" for="Email">Почта:</label>
        <input class="text" type="text" id="Email" name="email" placeholder="Введите почту" th:value="${user.getEmail()}" pattern='^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$' title="Вы ввели некорректный email" required>
        <label class="label" for="Address">Адрес:</label>
        <input class="text" type="text" th:value="${user.getAddress()}" id="Address" name="address" placeholder="Введите адрес"  required>
        <br>
        <button class="button" type="submit" style="width: 86px;">Сохранить</button>
    </form>
</div>
</body>
</html>
